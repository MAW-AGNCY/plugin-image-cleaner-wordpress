<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Recovery Notification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #28a745;
        }
        .details {
            margin: 20px 0;
            padding: 15px;
            background: #eafbe7;
            border: 1px solid #c3e6cb;
            border-radius: 5px;
        }
        .button {
            display: inline-block;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Image Recovery Notification</h1>
        <p>Hello,</p>
        <p>The following recovery process was completed successfully:</p>
        <div class="details">
            <p><strong>Images Recovered:</strong> {{recovered_images}}</p>
            <p><strong>Recovery Time:</strong> {{recovery_time}}</p>
        </div>
        <p>Thank you for using <strong>Image Cleaner</strong>.</p>
        <p><a href="{{dashboard_url}}" class="button">View Recovery Details</a></p>
    </div>
</body>
</html>
