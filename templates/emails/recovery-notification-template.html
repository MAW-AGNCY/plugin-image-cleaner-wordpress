<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Restauración Completada</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f9f9f9; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%">
        <tr>
            <td style="padding: 20px 0;">
                <table align="center" border="0" cellpadding="0" cellspacing="0" width="600" style="background-color: #ffffff; border: 1px solid #e1e1e1; border-top: 4px solid #46b450;">
                    <!-- El borde verde indica éxito -->
                    <tr>
                        <td align="center" style="padding: 30px 20px; border-bottom: 1px solid #e1e1e1;">
                            <img src="{{logo_url}}" alt="Mondays at Work" width="180" style="display: block;" />
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 40px 30px; color: #444444;">
                            <h2 style="color: #46b450; margin: 0 0 20px 0; font-size: 22px;">✅ Archivos Restaurados</h2>
                            <p style="font-size: 16px; line-height: 24px; color: #555555;">
                                La operación de recuperación se ha completado con éxito. Los archivos solicitados han vuelto a la Biblioteca de Medios y son visibles públicamente.
                            </p>
                            
                            <div style="background-color: #f9f9f9; border: 1px solid #e1e1e1; padding: 15px; margin: 20px 0; border-radius: 4px;">
                                <strong style="color: #444444;">Resumen de la acción:</strong>
                                <ul style="color: #555555; margin-bottom: 0;">
                                    <li><strong>Mensaje:</strong> {{message}}</li>
                                    <li><strong>Fecha:</strong> {{year}}</li>
                                </ul>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td bgcolor="#f4f4f4" style="padding: 20px; text-align: center; font-size: 12px; color: #808080; border-top: 1px solid #e1e1e1;">
                            &copy; {{year}} <strong>Mondays at Work</strong>.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
