<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Cleaner Report Summary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #0056b3;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        .summary-table th, .summary-table td {
            padding: 10px;
            border: 1px solid #ddd;
        }
        .summary-table th {
            background-color: #0056b3;
            color: white;
        }
        .button {
            display: inline-block;
            background-color: #0056b3;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Image Cleaner Report Summary</h1>
        <p>Hello,</p>
        <p>Here is a summary of the latest image cleanup process:</p>
        <table class="summary-table">
            <tr>
                <th>Total Images Analyzed</th>
                <td>{{total_images}}</td>
            </tr>
            <tr>
                <th>Unused Images Found</th>
                <td>{{unused_images}}</td>
            </tr>
            <tr>
                <th>Potential Space Recovered</th>
                <td>{{recovered_space}}</td>
            </tr>
        </table>
        <p>Thank you for using <strong>Image Cleaner</strong>.</p>
        <p><a href="{{dashboard_url}}" class="button">View Details</a></p>
    </div>
</body>
</html>
