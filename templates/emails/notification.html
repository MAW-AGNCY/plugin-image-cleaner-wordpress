<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Notificación MAW Image Cleaner</title>
    <style type="text/css">
        body { margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, sans-serif; color: #333333; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .header { background-color: #2271b1; padding: 20px; text-align: center; color: #ffffff; }
        .header h1 { margin: 0; font-size: 22px; font-weight: normal; }
        .content { padding: 30px; line-height: 1.6; }
        .footer { background-color: #eeeeee; padding: 15px; text-align: center; font-size: 12px; color: #888888; }
        .button { display: inline-block; padding: 10px 20px; background-color: #2271b1; color: #ffffff; text-decoration: none; border-radius: 4px; margin-top: 20px; font-weight: bold; }
        .warning-box { background: #fff8e5; border-left: 4px solid #dba617; padding: 10px; margin: 15px 0; font-size: 14px; }
    </style>
</head>
<body>
    <div style="padding: 20px;">
        <div class="container">
            <!-- Cabecera -->
            <div class="header">
                <h1>{{plugin_name}}</h1>
            </div>
            
            <!-- Contenido -->
            <div class="content">
                <h2>Hola, Administrador</h2>
                <p>{{message}}</p>
                
                <div class="warning-box">
                    <strong>Estado del Sistema:</strong> Funcionando correctamente.<br>
                    <strong>Fecha:</strong> {{year}}
                </div>

                <p>Puedes gestionar tu biblioteca de medios accediendo al panel:</p>
                
                <center>
                    <a href="{{site_url}}/wp-admin/admin.php?page=image-cleaner-overview" class="button" style="color:#ffffff;">Ir al Dashboard</a>
                </center>
            </div>

            <!-- Pie de página -->
            <div class="footer">
                &copy; {{year}} <strong>{{site_name}}</strong>.<br>
                Optimizado por <a href="https://www.mondaysatwork.com" style="color:#666;">Mondays at Work</a>
            </div>
        </div>
    </div>
</body>
</html>
